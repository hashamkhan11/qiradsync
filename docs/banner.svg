<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F4C45"/>
      <stop offset="1" stop-color="#082925"/>
    </linearGradient>
    <pattern id="geo" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M32 4 L60 32 L32 60 L4 32 Z" fill="none" stroke="#E2B95B" stroke-opacity="0.06" stroke-width="1.5"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#geo)"/>

  <!-- left: title -->
  <g transform="translate(96 0)">
    <text x="0" y="200" fill="#FFFFFF" font-size="88" font-weight="800" letter-spacing="-2">QiradSync</text>
    <text x="4" y="256" fill="#E2B95B" font-size="34" font-weight="600">Two partners. One ledger.</text>
    <text x="4" y="316" fill="#FFFFFF" fill-opacity="0.82" font-size="23">
      <tspan x="4" dy="0">Offline-first ledger for Mudaraba partnerships.</tspan>
      <tspan x="4" dy="34">Every phone keeps the full, signed history.</tspan>
      <tspan x="4" dy="34">The server only passes records along.</tspan>
    </text>
    <g font-size="18" font-weight="600" fill="#FFFFFF">
      <rect x="4" y="452" width="102" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.12"/>
      <text x="55" y="477" text-anchor="middle">Flutter</text>
      <rect x="118" y="452" width="104" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.12"/>
      <text x="170" y="477" text-anchor="middle">Ed25519</text>
      <rect x="234" y="452" width="80" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.12"/>
      <text x="274" y="477" text-anchor="middle">CRDT</text>
      <rect x="326" y="452" width="104" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.12"/>
      <text x="378" y="477" text-anchor="middle">Laravel</text>
    </g>
  </g>

  <!-- relay -->
  <g transform="translate(925 70)">
    <rect x="-80" y="0" width="160" height="62" rx="31" fill="#FFFFFF" fill-opacity="0.1" stroke="#E2B95B" stroke-opacity="0.5"/>
    <text x="0" y="27" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">Relay</text>
    <text x="0" y="46" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.7" font-size="11">stores and forwards only</text>
  </g>
  <g stroke="#E2B95B" stroke-width="2.5" fill="none" stroke-dasharray="2 7" stroke-linecap="round" opacity="0.8">
    <path d="M845 101 C 790 101, 780 150, 780 176"/>
    <path d="M1005 101 C 1060 101, 1070 150, 1070 176"/>
  </g>

  <!-- signed record chain between phones -->
  <g transform="translate(880 300)">
    <g fill="#E2B95B">
      <rect x="0" y="0" width="34" height="26" rx="5"/>
      <rect x="28" y="40" width="34" height="26" rx="5" opacity="0.85"/>
      <rect x="56" y="80" width="34" height="26" rx="5" opacity="0.7"/>
    </g>
    <g stroke="#E2B95B" stroke-width="2" opacity="0.7">
      <line x1="22" y1="26" x2="40" y2="40"/>
      <line x1="50" y1="66" x2="68" y2="80"/>
    </g>
    <g fill="#082925" font-size="10" font-weight="800" text-anchor="middle">
      <text x="17" y="17">#1</text><text x="45" y="57">#2</text><text x="73" y="97">#3</text>
    </g>
    <text x="45" y="132" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.75" font-size="11">signed · chained</text>
  </g>

  <!-- phone template drawn twice -->
  <g id="investor" transform="translate(690 190)" filter="url(#shadow)">
    <rect width="180" height="380" rx="26" fill="#04140F"/>
    <rect x="8" y="8" width="164" height="364" rx="20" fill="#FFFFFF"/>
    <rect x="8" y="8" width="164" height="54" rx="20" fill="#0F4C45"/>
    <rect x="8" y="40" width="164" height="22" fill="#0F4C45"/>
    <text x="22" y="38" fill="#FFFFFF" font-size="14" font-weight="700">Investor</text>
    <circle cx="150" cy="34" r="5" fill="#5BE3A4"/>
    <g font-size="11" fill="#5E6B68">
      <text x="22" y="88">Capital</text>
      <text x="22" y="108" fill="#10201D" font-size="18" font-weight="800">Rs 500,000</text>
      <text x="22" y="136">Result</text>
      <text x="22" y="156" fill="#0B7A53" font-size="18" font-weight="800">+Rs 80,000</text>
      <line x1="22" y1="174" x2="158" y2="174" stroke="#E3E8E6"/>
      <text x="22" y="196">Profit split</text>
      <rect x="22" y="206" width="136" height="12" rx="6" fill="#E3E8E6"/>
      <rect x="22" y="206" width="82" height="12" rx="6" fill="#0F4C45"/>
      <rect x="104" y="206" width="54" height="12" rx="0" fill="#E2B95B"/>
      <rect x="146" y="206" width="12" height="12" rx="6" fill="#E2B95B"/>
      <text x="22" y="240" fill="#10201D" font-weight="700">Investor 60%</text>
      <text x="158" y="240" text-anchor="end" fill="#10201D">48,000</text>
      <text x="22" y="260" fill="#10201D" font-weight="700">Manager 40%</text>
      <text x="158" y="260" text-anchor="end" fill="#10201D">32,000</text>
    </g>
    <rect x="22" y="300" width="136" height="40" rx="20" fill="#E8F6EF"/>
    <text x="90" y="325" text-anchor="middle" fill="#0B7A53" font-size="12" font-weight="700">Works offline</text>
  </g>

  <g transform="translate(980 190)" filter="url(#shadow)">
    <rect width="180" height="380" rx="26" fill="#04140F"/>
    <rect x="8" y="8" width="164" height="364" rx="20" fill="#FFFFFF"/>
    <rect x="8" y="8" width="164" height="54" rx="20" fill="#0F4C45"/>
    <rect x="8" y="40" width="164" height="22" fill="#0F4C45"/>
    <text x="22" y="38" fill="#FFFFFF" font-size="14" font-weight="700">Manager</text>
    <circle cx="150" cy="34" r="5" fill="#5BE3A4"/>
    <g font-size="11" fill="#5E6B68">
      <text x="22" y="88">Capital</text>
      <text x="22" y="108" fill="#10201D" font-size="18" font-weight="800">Rs 500,000</text>
      <text x="22" y="136">Result</text>
      <text x="22" y="156" fill="#0B7A53" font-size="18" font-weight="800">+Rs 80,000</text>
      <line x1="22" y1="174" x2="158" y2="174" stroke="#E3E8E6"/>
      <text x="22" y="196">Profit split</text>
      <rect x="22" y="206" width="136" height="12" rx="6" fill="#E3E8E6"/>
      <rect x="22" y="206" width="82" height="12" rx="6" fill="#0F4C45"/>
      <rect x="104" y="206" width="54" height="12" rx="0" fill="#E2B95B"/>
      <rect x="146" y="206" width="12" height="12" rx="6" fill="#E2B95B"/>
      <text x="22" y="240" fill="#10201D" font-weight="700">Investor 60%</text>
      <text x="158" y="240" text-anchor="end" fill="#10201D">48,000</text>
      <text x="22" y="260" fill="#10201D" font-weight="700">Manager 40%</text>
      <text x="158" y="260" text-anchor="end" fill="#10201D">32,000</text>
    </g>
    <rect x="22" y="300" width="136" height="40" rx="20" fill="#E8F6EF"/>
    <text x="90" y="325" text-anchor="middle" fill="#0B7A53" font-size="12" font-weight="700">Same result</text>
  </g>
</svg>
